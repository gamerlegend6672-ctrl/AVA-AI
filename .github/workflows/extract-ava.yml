
name: Extract AVA Source Code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract AVA ZIP
        run: |
          mkdir unpacked
          unzip -q ava-main.zip -d unpacked

          ROOT=$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ]; then
            cp -a "$ROOT"/. .
          else
            cp -a unpacked/. .
          fi

          rm -rf unpacked ava-main.zip

      - name: Push Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract AVA source code" || exit 0
          git push origin HEAD:main
