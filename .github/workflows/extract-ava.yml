
name: Extract AVA Source Code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract AVA ZIP
        run: |
          set -e

          if [ ! -f ava-main.zip ]; then
            echo "ERROR: ava-main.zip not found!"
            exit 1
          fi

          mkdir -p unpacked
          unzip -q ava-main.zip -d unpacked

          ROOT=$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ]; then
            cp -a "$ROOT"/. .
          else
            cp -a unpacked/. .
          fi

          rm -rf unpacked
          rm -f ava-main.zip

      - name: Commit and Push Source Files
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/

          git commit -m "Extract complete AVA source code" || true

          git push origin HEAD:main
