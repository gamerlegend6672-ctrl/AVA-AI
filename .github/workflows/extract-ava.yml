
name: Extract AVA Source Code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Parts
        run: |
          cat AVA.part* > AVA.zip
          mkdir unpacked
          unzip -q AVA.zip -d unpacked

          ROOT=$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ] && [ "$(find unpacked -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
            cp -a "$ROOT"/. .
          else
            cp -a unpacked/. .
          fi

          rm -rf unpacked AVA.zip
          rm -f AVA.part*

      - name: Push Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload complete AVA source code"
          git push origin HEAD:main
